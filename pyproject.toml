[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-merger"
version = "0.1.1"
description = "Sync a Bruno opencollection with an updated OpenAPI schema via a git-like review flow"
requires-python = ">=3.9"
dependencies = [
    "ruamel.yaml>=0.17",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
api-merge = "api_merger.cli:main"

[tool.setuptools.packages.find]
include = ["api_merger*"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]  # long f-strings/descriptions are fine
